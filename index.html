<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7">
<title>Match &amp; Learn</title>
<style>
[hidden]{display:none!important}
:root{--blue:#007aff;--green:#34c759;--red:#ff3b30;--orange:#ff9500;--gray:#e5e5ea}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;min-height:100dvh;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;display:flex;justify-content:center}button,input{font:inherit}button{border:0;cursor:pointer;touch-action:manipulation}.app{width:100%;max-width:480px;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}h1{text-align:center;margin:4px 0 18px;font-size:30px}.subtitle{margin:0 0 22px;color:#636366;text-align:center}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 12px #00000014;margin-bottom:14px}.screen[hidden]{display:none}.choices{display:grid;gap:14px}.choice{min-height:132px;border-radius:22px;color:#fff;padding:20px;display:flex;align-items:center;gap:18px;text-align:left;box-shadow:0 5px 16px #0000001f}.choice.numbers{background:linear-gradient(135deg,#087cff,#5856d6)}.choice.words{background:linear-gradient(135deg,#ff9f0a,#ff375f)}.choice-icon{font-size:42px;width:70px;text-align:center;font-weight:750}.choice strong{display:block;font-size:25px;margin-bottom:4px}.choice small{font-size:15px;opacity:.92}.topbar{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;margin-bottom:12px}.topbar h1{margin:0;font-size:27px}.home{background:transparent;color:var(--blue);min-height:44px;padding:0;text-align:left;font-weight:650}label{display:block;font-size:14px;font-weight:650;margin-bottom:7px}.target-row{display:flex;gap:9px}input{flex:1;min-width:0;font-size:21px;padding:12px 10px;border:1px solid #c7c7cc;border-radius:12px;text-align:center;text-transform:uppercase}.set{background:var(--blue);color:#fff;border-radius:12px;padding:0 18px;font-weight:650}.display{min-height:74px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;padding:4px 0 8px}.tile{min-width:38px;height:50px;padding:0 7px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--gray);font-size:26px;font-weight:750}.tile.correct{background:var(--green);color:#fff}.tile.wrong{background:var(--red);color:#fff}.tile.empty{color:#8e8e93}.tile.space{min-width:18px;width:18px;padding:0;background:transparent}.message{text-align:center;min-height:24px;font-weight:650;margin:3px 0 12px;color:#b42318}.message.success{color:#248a3d}.keypad{display:grid;gap:9px}.number-pad{grid-template-columns:repeat(3,1fr)}.word-pad{grid-template-columns:repeat(6,1fr);gap:7px}.key{height:62px;background:#fff;border-radius:15px;font-size:27px;font-weight:650;box-shadow:0 2px 7px #0000001a}.word-pad .key{height:49px;border-radius:11px;font-size:20px}.key:active,.choice:active{transform:scale(.97);filter:brightness(.96)}.zero{grid-column:2}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.action{height:54px;border-radius:14px;font-weight:650;background:#d1d1d6}.clear{background:var(--orange);color:#fff}.hint{color:#6e6e73;font-size:13px;line-height:1.35;text-align:center;margin-top:12px}@media(max-width:370px){.app{padding-left:11px;padding-right:11px}.word-pad{gap:5px}.word-pad .key{height:46px;font-size:18px}.tile{min-width:34px;height:47px;font-size:23px}}
</style>
</head>
<body>
<main class="app">
<section id="homeScreen" class="screen"><h1>Match &amp; Learn</h1><p class="subtitle">Choose what you want to practice.</p><div class="choices">
<button class="choice numbers" onclick="openMode('number')"><span class="choice-icon">123</span><span><strong>Numbers</strong><small>Match each number</small></span></button>
<button class="choice words" onclick="openMode('word')"><span class="choice-icon">ABC</span><span><strong>Words</strong><small>Match letters and short phrases</small></span></button>
</div></section>
<section id="gameScreen" class="screen" hidden><div class="topbar"><button class="home" onclick="goHome()">‹ Home</button><h1 id="gameTitle">Number Match</h1><span></span></div>
<div class="card"><label id="targetLabel" for="targetInput">Base Number</label><div class="target-row"><input id="targetInput" value="123456" maxlength="24" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="set" onclick="setTarget()">Set</button></div></div>
<div class="card"><div id="display" class="display" aria-live="polite"></div><div id="message" class="message" aria-live="polite"></div>
<div id="numberPad" class="keypad number-pad"><button class="key" onclick="press('1')">1</button><button class="key" onclick="press('2')">2</button><button class="key" onclick="press('3')">3</button><button class="key" onclick="press('4')">4</button><button class="key" onclick="press('5')">5</button><button class="key" onclick="press('6')">6</button><button class="key" onclick="press('7')">7</button><button class="key" onclick="press('8')">8</button><button class="key" onclick="press('9')">9</button><button class="key zero" onclick="press('0')">0</button></div>
<div id="wordPad" class="keypad word-pad" hidden></div><div class="actions"><button class="action" onclick="backspace()">⌫ Backspace</button><button class="action clear" onclick="clearEntry()">Clear</button></div><div id="hint" class="hint"></div></div>
</section></main>
<script>
const state={mode:"number",numberTarget:"123456",wordTarget:"CAT",entered:""},alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ",el=id=>document.getElementById(id);
alphabet.split("").forEach(letter=>{const button=document.createElement("button");button.className="key";button.textContent=letter;button.setAttribute("aria-label",letter);button.addEventListener("click",()=>press(letter));el("wordPad").appendChild(button)});
function currentTarget(){return state.mode==="number"?state.numberTarget:state.wordTarget}
function openMode(mode){state.mode=mode;state.entered="";const isNumber=mode==="number";el("homeScreen").hidden=true;el("gameScreen").hidden=false;el("gameTitle").textContent=isNumber?"Number Match":"Word Match";el("targetLabel").textContent=isNumber?"Base Number":"Word or Short Phrase";el("targetInput").value=currentTarget();el("targetInput").inputMode=isNumber?"numeric":"text";el("numberPad").hidden=!isNumber;el("wordPad").hidden=isNumber;el("hint").textContent=isNumber?"Each number is matched to the same position.":"Letters are in ABC order. Spaces are added automatically.";render()}
function goHome(){el("gameScreen").hidden=true;el("homeScreen").hidden=false}
function cleanTarget(value){return state.mode==="number"?value.replace(/[^0-9]/g,""):value.toUpperCase().replace(/[^A-Z ]/g,"").replace(/\s+/g," ").trim()}
function setTarget(){const value=cleanTarget(el("targetInput").value);if(!value){el("message").textContent=state.mode==="number"?"Enter at least one number.":"Enter a word or short phrase.";return}if(state.mode==="number")state.numberTarget=value;else state.wordTarget=value;state.entered="";el("targetInput").value=value;render()}
function nextLetterIndex(){const target=currentTarget();let index=state.entered.length;while(target[index]===" "){state.entered+=" ";index++}return index}
function press(character){const target=currentTarget(),index=state.mode==="word"?nextLetterIndex():state.entered.length;if(index>=target.length)return;state.entered+=character;if(state.mode==="word")nextLetterIndex();render()}
function backspace(){if(!state.entered)return;state.entered=state.entered.slice(0,-1);while(state.entered.endsWith(" "))state.entered=state.entered.slice(0,-1);render()}
function clearEntry(){state.entered="";render()}
function render(){const target=currentTarget(),display=el("display");display.replaceChildren();[...target].forEach((character,index)=>{const tile=document.createElement("div");tile.className="tile";if(character===" "){tile.classList.add("space");tile.setAttribute("aria-hidden","true")}else if(index<state.entered.length){tile.textContent=state.entered[index];tile.classList.add(state.entered[index]===character?"correct":"wrong")}else{tile.textContent="•";tile.classList.add("empty")}display.appendChild(tile)});const complete=state.entered.length===target.length,correct=state.entered===target;el("message").textContent=complete?(correct?"✓ Perfect match!":"Some characters don't match."):"";el("message").className="message"+(correct&&complete?" success":"")}
el("targetInput").addEventListener("keydown",event=>{if(event.key==="Enter")setTarget()});render();
</script>
</body>
</html>
