<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Number Match</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f2f2f7; color: #111; min-height: 100vh;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 430px; padding: 22px 18px 28px; }
  h1 { text-align: center; margin: 8px 0 22px; font-size: 30px; }
  .card {
    background: white; border-radius: 18px; padding: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 16px;
  }
  label { display:block; font-size:14px; font-weight:600; margin-bottom:7px; }
  .base-row { display:flex; gap:9px; }
  input {
    flex:1; min-width:0; font-size:22px; padding:12px;
    border:1px solid #c7c7cc; border-radius:12px; text-align:center;
  }
  button { border:0; font:inherit; cursor:pointer; }
  .set { background:#007aff; color:white; border-radius:12px; padding:0 18px; font-weight:600; }
  .display {
    min-height:72px; display:flex; justify-content:center; align-items:center;
    flex-wrap:wrap; gap:7px; padding:8px; font-size:29px; font-weight:700;
    letter-spacing:1px;
  }
  .digit {
    width:42px; height:52px; border-radius:10px; display:flex;
    align-items:center; justify-content:center; background:#e5e5ea;
  }
  .correct { background:#34c759; color:white; }
  .wrong { background:#ff3b30; color:white; }
  .empty { background:#e5e5ea; color:#8e8e93; }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .key {
    height:68px; background:white; border-radius:16px; font-size:28px;
    box-shadow:0 2px 7px rgba(0,0,0,.09);
  }
  .key:active { transform:scale(.97); background:#e5e5ea; }
  .bottom { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .action { height:56px; border-radius:14px; font-weight:600; background:#d1d1d6; }
  .clear { background:#ff9500; color:white; }
  .message { text-align:center; min-height:24px; font-weight:600; margin-top:12px; }
  .success { color:#34a853; }
  .hint { color:#666; font-size:13px; text-align:center; margin-top:14px; }
</style>
</head>
<body>
<div class="app">
  <h1>Number Match</h1>

  <div class="card">
    <label for="base">Base Number</label>
    <div class="base-row">
      <input id="base" inputmode="numeric" pattern="[0-9]*" value="123456" aria-label="Base number">
      <button class="set" onclick="setBase()">Set</button>
    </div>
  </div>

  <div class="card">
    <div id="display" class="display"></div>
    <div id="message" class="message"></div>

    <div class="keypad">
      <button class="key" onclick="press('1')">1</button>
      <button class="key" onclick="press('2')">2</button>
      <button class="key" onclick="press('3')">3</button>
      <button class="key" onclick="press('4')">4</button>
      <button class="key" onclick="press('5')">5</button>
      <button class="key" onclick="press('6')">6</button>
      <button class="key" onclick="press('7')">7</button>
      <button class="key" onclick="press('8')">8</button>
      <button class="key" onclick="press('9')">9</button>
      <button class="key" onclick="press('0')">0</button>
    </div>

    <div class="bottom">
      <button class="action" onclick="backspace()">⌫ Backspace</button>
      <button class="action clear" onclick="clearEntry()">Clear</button>
    </div>
    <div class="hint">Each digit is matched directly to the same position in the base number.</div>
  </div>
</div>

<script>
let base = "123456";
let entered = "";

function setBase() {
  const value = document.getElementById("base").value.replace(/[^0-9]/g, "");
  if (!value) return;
  base = value;
  entered = "";
  document.getElementById("base").value = base;
  render();
}

function press(digit) {
  if (entered.length >= base.length) return;
  entered += digit;
  render();
}

function backspace() {
  entered = entered.slice(0, -1);
  render();
}

function clearEntry() {
  entered = "";
  render();
}

function render() {
  const display = document.getElementById("display");
  const message = document.getElementById("message");
  display.innerHTML = "";

  for (let i = 0; i < base.length; i++) {
    const box = document.createElement("div");
    box.className = "digit";
    if (i < entered.length) {
      box.textContent = entered[i];
      box.classList.add(entered[i] === base[i] ? "correct" : "wrong");
    } else {
      box.textContent = "•";
      box.classList.add("empty");
    }
    display.appendChild(box);
  }

  if (entered.length === base.length) {
    const allCorrect = entered === base;
    message.textContent = allCorrect ? "✓ Perfect match!" : "Some digits don't match.";
    message.className = "message " + (allCorrect ? "success" : "");
  } else {
    message.textContent = "";
    message.className = "message";
  }
}
render();
</script>
</body>
</html>
